[project]
name = "norax"
version = "0.1.1"
description = "Neural operators in JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.6",
    "jaxtyping>=0.3.9",
]

[project.optional-dependencies]
examples = [
    "pardax",
    "h5py>=3.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "optax>=0.2.5",
]

[tool.uv.sources]
pardax = { git = "ssh://git@github.com/christianfenton/pardax.git" }

[dependency-groups]
docs = [
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.5,<9.6",
    "mkdocstrings-python>=2.0.3",
    "ruff>=0.15.7",
]
test = [
    "beartype>=0.22.9",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["norax*"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["F722"]  # jaxtyping shape strings are falsely flagged as forward annotation syntax errors

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=norax,beartype.beartype"
